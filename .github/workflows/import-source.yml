name: Import EcoTrace source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'
      - '.ecotrace-source.br.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract demonstration project
        run: node scripts/unpack.cjs
      - name: Commit original source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import full EcoTrace demo project"
            git push
          fi
